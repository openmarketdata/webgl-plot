<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGL Candlestick Chart Demo</title>
    <link rel="stylesheet" href="style.css" type="text/css" />
    <style>
        .chart-wrap { position: relative; width: 100%; }
        .chart-wrap .canvas { width: 100%; }
        @media only screen and (max-width: 800px) { .chart-wrap { width: 95%; } }
        .chart-wrap .axes {
            position: absolute; inset: 0; width: 100%; height: 100%;
            pointer-events: none;
        }
        .controls { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; margin: 8px 0; }
        .controls fieldset { border: 1px solid #555; border-radius: 6px; padding: 4px 10px; display: flex; gap: 10px; }
        .controls legend { padding: 0 4px; color: #aaa; font-size: 0.9em; }
        .controls label { cursor: pointer; }
    </style>
</head>
<body>
    <div class="items">
        <p><strong>Candlestick Chart</strong> - <span id="intervalText">5s</span> candles, 1s incremental redraw, simulated 100ms tick feed</p>
        <p>Bodies: <code>WebglPolygonPlot</code> (fixed pool, updated in place). Wicks: <code>WebglLinePlot</code>. Axes: 2D canvas overlay.</p>

        <div class="controls">
            <fieldset>
                <legend>Axes</legend>
                <label><input type="checkbox" id="showXAxis" checked> Time (x)</label>
                <label><input type="checkbox" id="showYAxis" checked> Price (y)</label>
            </fieldset>
            <fieldset id="intervalGroup">
                <legend>Bar interval</legend>
                <label><input type="radio" name="interval" value="1000"> 1s</label>
                <label><input type="radio" name="interval" value="5000" checked> 5s</label>
                <label><input type="radio" name="interval" value="10000"> 10s</label>
                <label><input type="radio" name="interval" value="15000"> 15s</label>
                <label><input type="radio" name="interval" value="30000"> 30s</label>
            </fieldset>
        </div>

        <div class="chart-wrap">
            <canvas id="my_canvas" class="canvas" width="800" height="600"></canvas>
            <canvas id="axes_canvas" class="axes"></canvas>
        </div>

        <script type="module" src="./candle-chart.ts"></script>
    </div>
</body>
</html>
