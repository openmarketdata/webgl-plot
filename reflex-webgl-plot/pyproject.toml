[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reflex-webgl-plot"
version = "0.0.1"
description = "Reflex custom component wrapping the webgl-plot declarative plot() API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["reflex>=0.9.0"]

[tool.setuptools.packages.find]
where = ["custom_components"]

[tool.setuptools.package-dir]
"" = "custom_components"
